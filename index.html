<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Building Plastics Ltd | Site Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0D0D0B;
    --gold:#FBBB00;
    --white:#FFFFFF;
    --ink:#161512;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--gold);
    opacity:0;
    animation:fadeIn 0.7s ease-out forwards;
  }
  @keyframes fadeIn{ to{opacity:1;} }

  /* top black band, mirrors the logo's own black/gold split */
  .hero{
    background:var(--black);
    padding:64px 32px 96px;
    text-align:center;
    position:relative;
  }

  .logo-wrap img{
    width:min(340px, 78vw);
    display:block;
    margin:0 auto;
  }

  /* curved swoosh, echoing the oval motion-mark in the logo */
  .swoosh{
    max-width:520px;
    margin:36px auto 0;
    display:block;
  }
  .swoosh path{
    fill:none;
    stroke:var(--gold);
    stroke-width:3;
    stroke-linecap:round;
  }

  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(30px, 5vw, 46px);
    line-height:1.1;
    color:var(--white);
    text-transform:uppercase;
    letter-spacing:0.01em;
    margin-top:28px;
  }

  h1 span{ color:var(--gold); }

  /* bottom gold band carries the message + contact */
  .content{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 32px 64px;
  }

  .content-inner{
    max-width:560px;
    text-align:center;
  }

  p.lede{
    font-size:17px;
    line-height:1.65;
    color:var(--ink);
    margin-bottom:36px;
  }

  .contact{
    display:flex;
    flex-wrap:wrap;
    gap:14px 32px;
    align-items:center;
    justify-content:center;
    padding-top:32px;
    border-top:2px solid rgba(13,13,11,0.15);
  }
  .contact a{
    color:var(--ink);
    text-decoration:none;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.02em;
    border-bottom:3px solid var(--black);
    padding-bottom:3px;
    transition:opacity 0.15s ease;
  }
  .contact a:hover{ opacity:0.65; }

  footer{
    text-align:center;
    padding:24px 24px 32px;
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:rgba(22,21,18,0.55);
  }

  @media (max-width:480px){
    .hero{ padding:48px 20px 72px; }
    .content{ padding:44px 20px 48px; }
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="logo-wrap">
      <img src="abp-logo.png" alt="Advanced Building Plastics Ltd logo">
    </div>

    <svg class="swoosh" viewBox="0 0 520 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,20 C160,-5 360,45 510,20" />
    </svg>

    <h1>Our new site is<br><span>under construction</span></h1>
  </div>

  <div class="content">
    <div class="content-inner">
      <p class="lede">
        We're building a new home online. In the meantime, get in touch with our team directly for quotes, product information, or trade enquiries.
      </p>

      <div class="contact">
        <a href="mailto:abp.ltd@outlook.com">abp.ltd@outlook.com</a>
        <a href="tel:01773857717">01773 857717</a>
      </div>
    </div>
  </div>

  <footer>Advanced Building Plastics Ltd &nbsp;&middot;&nbsp; New site coming soon</footer>

</body>
</html>
